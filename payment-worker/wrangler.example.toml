name = "wardenclyffe-checkout-sandbox"
main = "worker.js"
compatibility_date = "2026-11-01"

# Replace frontend URLs only after verifying the actual Netlify origin.
[vars]
PAYMENTS_MODE = "sandbox"
ALLOWED_ORIGIN = "https://wardenclyffe-preview.netlify.app"
FRONTEND_BASE_URL = "https://wardenclyffe-preview.netlify.app"

[[d1_databases]]
binding = "ORDERS"
database_name = "wardenclyffe-orders-sandbox"
database_id = "REPLACE_WITH_D1_ID"

# Never commit secrets. Configure via `wrangler secret put <NAME>`:
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET
# OPENPAY_MERCHANT_ID, OPENPAY_PRIVATE_KEY
# OPENPAY_WEBHOOK_USER, OPENPAY_WEBHOOK_PASSWORD
# RESEND_API_KEY, RESEND_FROM
# BANK_RECONCILIATION_TOKEN
# Optional private approved files after legal review: CONTRACT_FILES R2 bucket
