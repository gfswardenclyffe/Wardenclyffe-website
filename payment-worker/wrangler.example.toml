name = "wardenclyffe-checkout-sandbox"
main = "worker.js"
compatibility_date = "2026-11-01"

# Copy to wrangler.toml and replace the placeholder IDs after resource creation.
[vars]
PAYMENTS_MODE = "sandbox"
ALLOWED_ORIGIN = "https://gfswardenclyffe.github.io"
FRONTEND_BASE_URL = "https://gfswardenclyffe.github.io/Wardenclyffe-website"

[[d1_databases]]
binding = "ORDERS"
database_name = "wardenclyffe-orders-sandbox"
database_id = "REPLACE_WITH_D1_ID"

# For real product fulfillment later, use an R2 bucket with approved files only.
# [[r2_buckets]]
# binding = "CONTRACT_FILES"
# bucket_name = "wardenclyffe-approved-contracts"

# Secrets (never commit): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, RESEND_API_KEY, RESEND_FROM
